<!doctype html>
<html lang="en" style="color-scheme: light">
  <head>
    <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../../styles.css" />
    <style>body { margin: 0; background: var(--bg); }</style>
    <title>Header — Capita Technology</title>
  </head>
  <body>
    <header class="site-header layer-fg" id="top">
      <div class="container header-inner">
        <a class="brand" href="#" aria-label="Capita Technology">
          <span class="brand-text">Capita<span style="color: var(--text)">.</span>Technology</span>
        </a>

        <div class="header-right">
          <nav class="nav" id="primaryNav" aria-label="Primary">
            <a href="#">Services</a>
            <a href="#">Bespoke</a>
            <a href="#">Outcomes</a>
            <a href="#">Method</a>
            <a href="#">FAQ</a>
          </nav>

          <a class="nav-cta" href="#">Talk to us</a>

          <button
            id="navToggle"
            class="nav-toggle"
            type="button"
            aria-label="Menu"
            aria-expanded="false"
            aria-controls="primaryNav"
          >
            <span class="nav-toggle-glyph" aria-hidden="true">☰</span>
          </button>
        </div>
      </div>
    </header>
  </body>
