<!doctype html>
<html lang="en" style="color-scheme: light">
  <head>
    <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../../styles.css" />
    <style>body { margin: 0; background: var(--bg); }</style>
    <title>LogoGrid — Capita Technology</title>
  </head>
  <body>
    <section class="trusted" aria-label="Where we have worked">
      <div class="container">
        <p class="eyebrow">Companies we've worked at and with</p>
        <div class="logo-grid">
          <div class="logo-cell">
            <span style="font-family:var(--font-display);font-weight:700;font-size:22px;color:var(--muted)">American Express</span>
          </div>
          <div class="logo-cell">
            <span style="font-family:var(--font-display);font-weight:700;font-size:22px;color:var(--muted)">JPMorgan Chase</span>
          </div>
          <div class="logo-cell">
            <span style="font-family:var(--font-display);font-weight:700;font-size:22px;color:var(--muted)">PwC</span>
          </div>
          <div class="logo-cell">
            <span style="font-family:var(--font-display);font-weight:700;font-size:22px;color:var(--muted)">Macy's</span>
          </div>
          <div class="logo-cell">
            <span style="font-family:var(--font-display);font-weight:700;font-size:22px;color:var(--muted)">The New York Times</span>
          </div>
          <div class="logo-cell">
            <span style="font-family:var(--font-display);font-weight:700;font-size:22px;color:var(--muted)">Marriott</span>
          </div>
          <div class="logo-cell">
            <span style="font-family:var(--font-display);font-weight:700;font-size:22px;color:var(--muted)">Wells Fargo</span>
          </div>
          <div class="logo-cell">
            <span style="font-family:var(--font-display);font-weight:700;font-size:22px;color:var(--muted)">Optus</span>
          </div>
          <div class="logo-cell">
            <span style="font-family:var(--font-display);font-weight:700;font-size:22px;color:var(--muted)">Mirvac</span>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
